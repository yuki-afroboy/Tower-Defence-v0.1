<style>
/* Last Fortress Defense - スマートフォン縦画面を最優先したスタイル */

:root {
  --bg: #10151d;
  --panel: #1a2130;
  --panel2: #232c3d;
  --line: #33405a;
  --text: #eaf0fb;
  --muted: #9aa8c0;
  --gold: #ffd75e;
  --hp: #ff6b7a;
  --accent: #4fc3ff;
  --ok: #5bd66d;
  --danger: #ff5c72;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---- 上部のステータスバー ------------------------------------------- */
#hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.stat {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}
.stat .ico { font-size: 15px; }
#stat-hp .val { color: var(--hp); min-width: 22px; }
#stat-gold .val { color: var(--gold); min-width: 34px; }
#stat-wave .val { color: var(--accent); }
#stat-wave b { font-size: 17px; }

.stat .bar {
  display: block;
  width: 34px;
  height: 6px;
  border-radius: 3px;
  background: #3a2430;
  overflow: hidden;
}
.stat .bar i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--hp);
  transition: width .25s ease;
}

.hud-btns { margin-left: auto; display: flex; gap: 6px; }

button {
  font-family: inherit;
  font-weight: 700;
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  cursor: pointer;
}
button:active { transform: translateY(1px); }
button[disabled] { opacity: .45; }

button.mini {
  min-width: 42px;
  min-height: 38px;
  padding: 6px 8px;
  font-size: 14px;
}
button.mini.on { background: var(--accent); color: #06121c; border-color: var(--accent); }
button.mini.muted { color: var(--muted); text-decoration: line-through; }

button.primary {
  background: linear-gradient(180deg, #4fc3ff, #2b8fd0);
  border-color: #2b8fd0;
  color: #04121d;
}
button.danger { background: #7a2233; border-color: #a33049; color: #ffdde3; }
button.ghost { background: transparent; }
button.big { width: 100%; padding: 16px; font-size: 17px; }

/* ---- ゲーム画面 ------------------------------------------------------ */
#stage {
  flex: 1 1 auto;
  position: relative;
  display: flex;
  /* 上端にそろえる: 下の操作エリアの高さが変わっても盤面が動かない */
  align-items: flex-start;
  justify-content: center;
  padding-top: 4px;
  min-height: 0;
  overflow: hidden;
}

canvas#game {
  display: block;
  touch-action: none;
  border-radius: 8px;
}

#boss-hp {
  position: absolute;
  top: 6px;
  left: 8px;
  right: 8px;
  height: 20px;
  background: rgba(10, 14, 20, .85);
  border: 1px solid #ff5f86;
  border-radius: 10px;
  overflow: hidden;
  pointer-events: none;
}
#boss-hp[hidden] { display: none; }
#boss-hp i {
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff3d6e, #ff8fae);
  transition: width .15s linear;
}
#boss-hp span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .08em;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
}

#toast {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%) translateY(8px);
  background: rgba(10, 14, 20, .92);
  border: 1px solid var(--line);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 9px 14px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  white-space: nowrap;
  z-index: 15;            /* タワーパネルより手前に出す */
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#wave-banner {
  position: absolute;
  left: 50%;

  display: flex;

<script>
/*
 * Last Fortress Defense - ゲーム全体の設定データ
 * ここの数値を変えるとゲームバランスが変わります。
 * (このファイルは DOM を使わないので Node.js のテストからも読み込めます)
 */
(function (global) {
  'use strict';

  var GRID_COLS = 9;
  var GRID_ROWS = 13;

  /* 敵が通る道の折れ点。 c = 列(0..8), r = 行(0..12)
     -1 は画面外(出現位置)です。 */
  var WAYPOINTS = [
    { c: -1, r: 1 },
    { c: 7, r: 1 },
    { c: 7, r: 3 },
    { c: 1, r: 3 },
    { c: 1, r: 5 },
    { c: 7, r: 5 },
    { c: 7, r: 7 },
    { c: 1, r: 7 },
    { c: 1, r: 9 },
    { c: 4, r: 9 },
    { c: 4, r: 12 }
  ];

  var BASE_CELL = { c: 4, r: 12 };

  /* 装飾の岩。道ではないがタワーも置けないマス */
  var ROCKS = [
    { c: 0, r: 6 },
    { c: 8, r: 8 },
    { c: 2, r: 11 },
    { c: 6, r: 11 }
  ];

  /* ---- 経路の計算 ---------------------------------------------------- */
  var segments = [];
  var totalLength = 0;
  for (var i = 0; i < WAYPOINTS.length - 1; i++) {
    var a = WAYPOINTS[i];
    var b = WAYPOINTS[i + 1];
    var len = Math.abs(b.c - a.c) + Math.abs(b.r - a.r); // 経路は必ず縦か横
    segments.push({ a: a, b: b, len: len, start: totalLength });
    totalLength += len;
  }

  /* 進んだ距離(マス単位)から座標(マス単位・中心基準)を求める */
  function posAt(dist) {
    if (dist <= 0) {
      return { x: WAYPOINTS[0].c + 0.5, y: WAYPOINTS[0].r + 0.5 };
    }
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      if (dist <= s.start + s.len || i === segments.length - 1) {
        var t = s.len === 0 ? 0 : Math.min(1, (dist - s.start) / s.len);
        return {
          x: s.a.c + (s.b.c - s.a.c) * t + 0.5,
          y: s.a.r + (s.b.r - s.a.r) * t + 0.5
        };
      }
    }
    var last = WAYPOINTS[WAYPOINTS.length - 1];
    return { x: last.c + 0.5, y: last.r + 0.5 };
  }

  /* 道になっているマスの一覧 */
  var pathCells = [];
  var pathKeys = Object.create(null);
  function addCell(c, r) {
    if (c < 0 || r < 0 || c >= GRID_COLS || r >= GRID_ROWS) return;
    var key = c + ',' + r;
    if (pathKeys[key]) return;
    pathKeys[key] = true;
    pathCells.push({ c: c, r: r });
  }
  for (var w = 0; w < WAYPOINTS.length - 1; w++) {
    var p = WAYPOINTS[w];
    var q = WAYPOINTS[w + 1];
    var dc = Math.sign(q.c - p.c);
    var dr = Math.sign(q.r - p.r);
    var cc = p.c;
    var rr = p.r;
    addCell(cc, rr);
    while (cc !== q.c || rr !== q.r) {
      cc += dc;
      rr += dr;
      addCell(cc, rr);
    }

  var TOWER_ORDER = ['archer', 'cannon', 'ice', 'sniper'];

    /*  3 */ W(1.45, [['normal', 12, 0.85, 0]]),
    /*  4 */ W(1.70, [['fast', 8, 0.7, 0], ['normal', 6, 1.0, 5]]),
    /*  5 */ W(1.95, [['normal', 10, 0.8, 0], ['fast', 8, 0.55, 6]], 'swift'),
    /*  6 */ W(2.20, [['fast', 16, 0.45, 0], ['normal', 6, 1.0, 4]]),
    /*  7 */ W(2.50, [['tank', 2, 3.0, 0], ['normal', 10, 0.8, 2]]),
    /*  8 */ W(2.85, [['tank', 3, 2.6, 0], ['fast', 12, 0.5, 3]], 'armored'),
    /*  9 */ W(3.25, [['tank', 4, 2.4, 0], ['normal', 14, 0.7, 2]]),
    /* 10 */ W(4.00, [['swarm', 30, 0.26, 0], ['normal', 8, 0.9, 8]], 'regen'),
    /* 11 */ W(4.70, [['swarm', 26, 0.28, 0], ['fast', 14, 0.42, 5]]),
    /* 12 */ W(5.40, [['tank', 4, 2.2, 0], ['swarm', 30, 0.26, 3]], 'swift'),
    /* 13 */ W(6.30, [['tank', 5, 2.0, 0], ['fast', 16, 0.4, 2], ['normal', 14, 0.6, 8]], 'armored'),
    /* 14 */ W(7.40, [['tank', 6, 1.9, 0], ['swarm', 34, 0.24, 2], ['fast', 14, 0.42, 10]], 'regen'),
    /* 15 */ W(8.00, [['boss', 1, 1, 0], ['tank', 4, 2.4, 6], ['swarm', 26, 0.28, 12]])
  ];

  /* ---- アクティブスキル ----------------------------------------------
     ゴールドを使わず、時間で回復する必殺技。Wave中に自分で撃ちます。 */
  var ABILITIES = {
    meteor: {
      key: 'meteor', name: 'メテオ', icon: '☄',
      desc: '狙った場所に隕石。装甲を無視した大ダメージ',
      cooldown: 30,
      radius: 1.35,
      aimed: true,
      slow: 0.4,
      slowDur: 1.5,
      damage: function (wave) { return 100 + wave * 25; }
    },
    freeze: {
      key: 'freeze', name: '氷結', icon: '❄',
      desc: '画面上のすべての敵を一時停止レベルまで減速',
      cooldown: 36,
      aimed: false,
      slow: 0.65,
      duration: 2.5
    }
  };
  var ABILITY_ORDER = ['meteor', 'freeze'];

  var BALANCE = {
    startGold: 250,
    startHp: 20,
    waveClearGold: function (wave) { return 40 + wave * 10; },
    earlyCallGold: function (wave) { return 10 + wave * 3; },
    sellRate: 0.6,
    minDamageRatio: 0.2 /* 装甲でどれだけ減っても元の20%は通る */
  };

  global.LFD = global.LFD || {};
  global.LFD.Config = {
    GRID_COLS: GRID_COLS,
    GRID_ROWS: GRID_ROWS,
    WAYPOINTS: WAYPOINTS,
    BASE_CELL: BASE_CELL,
    ROCKS: ROCKS,
    PATH_CELLS: pathCells,
    PATH_LENGTH: totalLength,
    posAt: posAt,
    isPath: isPath,
    isRock: isRock,
    inGrid: inGrid,
    isBuildable: isBuildable,
    TOWERS: TOWERS,
    TOWER_ORDER: TOWER_ORDER,
    AFFIXES: AFFIXES,
    ABILITIES: ABILITIES,
    ABILITY_ORDER: ABILITY_ORDER,
    ENEMIES: ENEMIES,
    WAVES: WAVES,
    BALANCE: BALANCE,
    TOTAL_WAVES: WAVES.length
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * Last Fortress Defense - ゲーム本体のロジック(描画なし)
 * DOM を一切使わないので、Node.js のテストからそのまま動かせます。
 */
(function (global) {
  'use strict';

  var C = global.LFD.Config;

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function dist2(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  /* ------------------------------------------------------------------ */

  function Game(options) {
    options = options || {};
    this.rng = mulberry32(options.seed === undefined ? 12345 : options.seed);
    this.reset();
  }

  Game.prototype.reset = function () {
    var B = C.BALANCE;
    var self = this;
    this.time = 0;
    this.gold = B.startGold;
    this.hp = B.startHp;
    this.maxHp = B.startHp;
    this.wave = 0;
    this.phase = 'ready';          /* ready | wave | victory | defeat */
    this.towers = [];
    this.enemies = [];
    this.projectiles = [];
    this.effects = [];
    this.particles = [];
    this.spawnQueue = [];
    this.pendingWaves = [];
    this.grid = Object.create(null);
    this.nextId = 1;
    this.shake = 0;
    this.stats = { killed: 0, leaked: 0, goldEarned: 0, spent: 0, abilitiesUsed: 0 };
    this.abilities = {};
    C.ABILITY_ORDER.forEach(function (k) { self.abilities[k] = { cd: 0 }; });
    this.events = [];              /* UI に伝えるための出来事 */
  };

  Game.prototype.emit = function (type, data) {
    this.events.push({ type: type, data: data || null });
  };

  Game.prototype.drainEvents = function () {
    var e = this.events;
    this.events = [];
    return e;
  };

  /* ---- タワー -------------------------------------------------------- */

  Game.prototype.towerAt = function (c, r) {
    return this.grid[c + ',' + r] || null;
  };

  Game.prototype.canBuild = function (c, r) {
    if (!C.isBuildable(c, r)) return false;
    if (c === C.BASE_CELL.c && r === C.BASE_CELL.r) return false;
    return !this.towerAt(c, r);
  };

  Game.prototype.build = function (c, r, typeId) {
    var def = C.TOWERS[typeId];
    if (!def) return { ok: false, reason: 'type' };
    if (this.phase === 'victory' || this.phase === 'defeat') return { ok: false, reason: 'over' };
    if (!this.canBuild(c, r)) return { ok: false, reason: 'place' };
    if (this.gold < def.cost) return { ok: false, reason: 'gold' };

    this.gold -= def.cost;
    this.stats.spent += def.cost;
    var t = {
      id: this.nextId++,
      type: typeId,
      def: def,
      c: c, r: r,
      x: c + 0.5, y: r + 0.5,
      level: 0,                    /* 0 が Lv1 */
      branch: null,                /* Lv4で選んだ進化先 */
      invested: def.cost,
      cooldown: 0,
      angle: -Math.PI / 2,
      recoil: 0,
      kills: 0,
      damageDone: 0,
      builtAt: this.time
    };
    this.towers.push(t);
    this.grid[c + ',' + r] = t;
    this.spawnParticles(t.x, t.y, 12, def.color, 2.2);
    this.emit('build', t);
    return { ok: true, tower: t };
  };

  /* Lv1..Lv3 は levels[]、Lv4 は選んだ branch の性能を使う */
  Game.prototype.towerStats = function (t) {
    if (t.branch !== null && t.branch !== undefined) return t.def.branches[t.branch];
    return t.def.levels[t.level];
  };

  Game.prototype.isMaxLevel = function (t) {
    return t.branch !== null && t.branch !== undefined;
  };

  /* 次の強化の選択肢。Lv3のときは2つ返る(分岐) */
  Game.prototype.upgradeOptions = function (t) {
    if (this.isMaxLevel(t)) return [];
    var next = t.def.levels[t.level + 1];
    if (next) return [{ index: null, cost: next.up, stats: next }];
    return t.def.branches.map(function (b, i) {
      return { index: i, cost: b.up, stats: b, label: b.label, note: b.note };
    });
  };

  Game.prototype.upgradeCost = function (t, branchIndex) {
    var opts = this.upgradeOptions(t);
    if (!opts.length) return null;
    if (branchIndex === undefined || branchIndex === null) return opts[0].cost;
    var found = null;
    opts.forEach(function (o) { if (o.index === branchIndex) found = o; });
    return found ? found.cost : null;
  };

  Game.prototype.upgrade = function (t, branchIndex) {
    if (!t || this.phase === 'victory' || this.phase === 'defeat') return { ok: false, reason: 'over' };
    var opts = this.upgradeOptions(t);
    if (!opts.length) return { ok: false, reason: 'max' };
    var choice = opts[0];
    if (branchIndex !== undefined && branchIndex !== null) {
      opts.forEach(function (o) { if (o.index === branchIndex) choice = o; });
    }
    var cost = choice.cost;
    if (this.gold < cost) return { ok: false, reason: 'gold' };
    this.gold -= cost;
    this.stats.spent += cost;
    t.invested += cost;
    t.level++;
    if (choice.index !== null && choice.index !== undefined) t.branch = choice.index;
    this.spawnParticles(t.x, t.y, 18, '#ffe066', 3);
    this.addEffect({ kind: 'ring', x: t.x, y: t.y, r0: 0.2, r1: 1.3, life: 0.45, max: 0.45, color: '#ffe066' });
    this.emit('upgrade', t);
    return { ok: true, tower: t };
  };

  Game.prototype.sellValue = function (t) {
    return Math.floor(t.invested * C.BALANCE.sellRate);
  };

  Game.prototype.sell = function (t) {
    if (!t) return { ok: false };
    var idx = this.towers.indexOf(t);
    if (idx < 0) return { ok: false };
    var value = this.sellValue(t);
    this.towers.splice(idx, 1);
    delete this.grid[t.c + ',' + t.r];
    this.gold += value;
    this.spawnParticles(t.x, t.y, 14, '#cfd8e3', 2.4);
    this.floatText(t.x, t.y, '+' + value, '#ffd75e');
    this.emit('sell', { tower: t, value: value });
    return { ok: true, value: value };
  };

  /* ---- Wave ---------------------------------------------------------- */

  Game.prototype.canStartWave = function () {
    return (this.phase === 'ready' || this.phase === 'wave') && this.wave < C.TOTAL_WAVES;
  };

  Game.prototype.startWave = function () {
    if (!this.canStartWave()) return { ok: false };
    var early = this.phase === 'wave';
    if (early) {
      var bonus = C.BALANCE.earlyCallGold(this.wave);
      this.gold += bonus;
      this.stats.goldEarned += bonus;
      this.floatText(C.BASE_CELL.c + 0.5, C.BASE_CELL.r - 0.2, '+' + bonus, '#ffd75e');
    }
    this.wave++;
    var waveNo = this.wave;
    var def = C.WAVES[waveNo - 1];
    var base = this.time;
    var self = this;
    def.groups.forEach(function (g) {
      var type = g[0], count = g[1], gap = g[2], delay = g[3] || 0;
      for (var i = 0; i < count; i++) {
        self.spawnQueue.push({
          t: base + delay + i * gap,
          type: type,
          hpMul: def.hpMul,
          wave: waveNo,
          affix: def.affix
        });
      }
    });
    this.spawnQueue.sort(function (a, b) { return a.t - b.t; });
    this.pendingWaves.push(waveNo);
    this.phase = 'wave';
    this.emit('waveStart', { wave: waveNo, early: early, affix: def.affix });
    return { ok: true, early: early };
  };

  /* ---- 敵 ------------------------------------------------------------ */

  Game.prototype.spawnEnemy = function (typeId, hpMul, waveNo, affixKey) {
    var def = C.ENEMIES[typeId];
    var hp = Math.round(def.hp * hpMul);
    var affix = affixKey ? C.AFFIXES[affixKey] : null;
    var e = {
      id: this.nextId++,
      type: typeId,
      def: def,
      hp: hp,
      maxHp: hp,
      affix: affix,
      armor: def.armor + (affix && affix.armorAdd ? affix.armorAdd : 0),
      regenPct: affix && affix.regenPct ? affix.regenPct : 0,
      burn: 0,
      burnDps: 0,
      baseSpeed: def.speed * (affix && affix.speedMul ? affix.speedMul : 1),
      dist: 0,
      x: 0, y: 0,
      offset: (this.rng() - 0.5) * 0.34,
      slow: 0,
      slowTimer: 0,
      hitFlash: 0,
      wave: waveNo,
      alive: true,
      wobble: this.rng() * Math.PI * 2
    };
    this.updateEnemyPos(e);
    this.enemies.push(e);
    if (def.boss) {
      this.shake = Math.max(this.shake, 1.0);
      this.addEffect({ kind: 'ring', x: e.x, y: e.y, r0: 0.3, r1: 4, life: 0.9, max: 0.9, color: '#ff3d6e' });
      this.emit('bossSpawn', e);
    }
    return e;
  };

  Game.prototype.updateEnemyPos = function (e) {
    var p = C.posAt(e.dist);
    var p2 = C.posAt(e.dist + 0.05);
    var dx = p2.x - p.x, dy = p2.y - p.y;
    var len = Math.hypot(dx, dy) || 1;
    e.x = p.x + (-dy / len) * e.offset;
    e.y = p.y + (dx / len) * e.offset;
    e.dirX = dx / len;
    e.dirY = dy / len;
  };

  Game.prototype.damageEnemy = function (e, amount, pierce, source) {
    if (!e.alive) return 0;
    var dmg = pierce ? amount
      : Math.max(amount * C.BALANCE.minDamageRatio, amount - e.armor);
    e.hp -= dmg;
    e.hitFlash = 0.13;
    if (source) source.damageDone += dmg;
    if (e.hp <= 0) {
      e.alive = false;
      this.stats.killed++;
      var reward = e.def.gold;
      this.gold += reward;
      this.stats.goldEarned += reward;
      if (source) source.kills++;
      this.spawnParticles(e.x, e.y, e.def.boss ? 60 : 10, e.def.color, e.def.boss ? 5 : 2.6);
      this.floatText(e.x, e.y, '+' + reward, '#ffd75e');
      if (e.def.boss) this.shake = Math.max(this.shake, 1.4);
      this.emit('kill', e);
    }
    return dmg;
  };

  Game.prototype.applySlow = function (e, amount, duration) {
    if (amount >= e.slow || e.slowTimer <= 0) {
      e.slow = Math.max(e.slow, amount);
      e.slowTimer = Math.max(e.slowTimer, duration);
    }
  };

  /* ---- アクティブスキル ---------------------------------------------- */

  Game.prototype.abilityReady = function (key) {
    var a = this.abilities[key];
    return !!a && a.cd <= 0;
  };

  Game.prototype.useAbility = function (key, x, y) {
    var def = C.ABILITIES[key];
    if (!def) return { ok: false, reason: 'type' };
    if (this.phase !== 'wave' && this.phase !== 'ready') return { ok: false, reason: 'over' };
    if (!this.abilityReady(key)) return { ok: false, reason: 'cooldown' };

    if (key === 'meteor') {
      if (x === undefined || y === undefined) return { ok: false, reason: 'aim' };
      var dmg = def.damage(Math.max(1, this.wave));
      var r2 = def.radius * def.radius;
      var hits = 0;
      for (var i = 0; i < this.enemies.length; i++) {
        var e = this.enemies[i];
        if (!e.alive) continue;
        var d2 = dist2(x, y, e.x, e.y);
        if (d2 <= r2) {
          var falloff = 1 - 0.35 * (Math.sqrt(d2) / def.radius);
          this.damageEnemy(e, dmg * falloff, true, null);
          if (e.alive && def.slow) this.applySlow(e, def.slow, def.slowDur);
          hits++;
        }
      }
      this.addEffect({ kind: 'ring', x: x, y: y, r0: 0.2, r1: def.radius, life: 0.5, max: 0.5, color: '#ff9a3c' });
      this.addEffect({ kind: 'ring', x: x, y: y, r0: 0.1, r1: def.radius * 1.5, life: 0.75, max: 0.75, color: '#ffd75e' });
      this.spawnParticles(x, y, 46, '#ffb454', 5.5);
      this.shake = Math.max(this.shake, 1.1);
      this.abilities[key].cd = def.cooldown;
      this.stats.abilitiesUsed++;
      this.emit('ability', { key: key, x: x, y: y, hits: hits });
      return { ok: true, hits: hits };
    }

    /* 氷結: 画面上の敵をまとめて減速 */
    var frozen = 0;
    for (var j = 0; j < this.enemies.length; j++) {
      var en = this.enemies[j];
      if (!en.alive) continue;
      this.applySlow(en, def.slow, def.duration);
      frozen++;
    }
    this.addEffect({
      kind: 'ring', x: C.GRID_COLS / 2, y: C.GRID_ROWS / 2,
      r0: 0.5, r1: C.GRID_ROWS, life: 0.6, max: 0.6, color: '#7fdcff'
    });
    this.addEffect({ kind: 'flash', color: 'rgba(120,220,255,0.45)', life: 0.35, max: 0.35 });
    this.abilities[key].cd = def.cooldown;
    this.stats.abilitiesUsed++;
    this.emit('ability', { key: key, frozen: frozen });
    return { ok: true, frozen: frozen };
  };

  Game.prototype.updateAbilities = function (dt) {
    var self = this;
    C.ABILITY_ORDER.forEach(function (k) {
      var a = self.abilities[k];
      if (a.cd > 0) {
        a.cd = Math.max(0, a.cd - dt);
        if (a.cd === 0) self.emit('abilityReady', { key: k });
      }
    });
  };

  /* ---- エフェクト ---------------------------------------------------- */

  Game.prototype.addEffect = function (fx) {
    if (this.effects.length < 160) this.effects.push(fx);
  };

  Game.prototype.floatText = function (x, y, text, color) {
    this.addEffect({ kind: 'text', x: x, y: y, text: text, color: color, life: 0.9, max: 0.9 });
  };

  Game.prototype.spawnParticles = function (x, y, count, color, speed) {
    if (this.particles.length > 320) return;
    for (var i = 0; i < count; i++) {
      var a = this.rng() * Math.PI * 2;
      var s = speed * (0.35 + this.rng() * 0.75);
      var life = 0.3 + this.rng() * 0.45;
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, max: life,
        color: color,
        size: 0.05 + this.rng() * 0.07
      });
    }
  };

  /* ---- メインの更新処理 ---------------------------------------------- */

  Game.prototype.update = function (dt) {
    if (this.phase === 'victory' || this.phase === 'defeat') {
      this.updateVisuals(dt);
      return;
    }
    this.time += dt;

    /* 出現 */
    while (this.spawnQueue.length && this.spawnQueue[0].t <= this.time) {
      var s = this.spawnQueue.shift();
      this.spawnEnemy(s.type, s.hpMul, s.wave, s.affix);
    }

    this.updateAbilities(dt);
    this.updateEnemies(dt);
    this.updateTowers(dt);
    this.updateProjectiles(dt);
    this.updateVisuals(dt);
    this.checkWaveEnd();
  };

  Game.prototype.updateEnemies = function (dt) {
    var alive = [];
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.alive) continue;
      if (e.slowTimer > 0) {
        e.slowTimer -= dt;
        if (e.slowTimer <= 0) { e.slow = 0; e.slowTimer = 0; }
      }
      if (e.hitFlash > 0) e.hitFlash -= dt;

      /* 「再生」特性: 毎秒HPの数%を回復 */
      if (e.regenPct > 0 && e.hp < e.maxHp) {
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.regenPct * dt);
      }
      /* 焼夷弾の延焼ダメージ(装甲を無視) */
      if (e.burn > 0) {
        e.burn -= dt;
        this.damageEnemy(e, e.burnDps * dt, true, null);
        if (!e.alive) continue;
      }

      var speed = e.baseSpeed * (1 - e.slow);
      e.dist += speed * dt;
      if (e.dist >= C.PATH_LENGTH) {
        e.alive = false;
        this.hp -= e.def.damage;
        this.stats.leaked++;
        this.shake = Math.max(this.shake, e.def.boss ? 1.2 : 0.5);
        this.addEffect({
          kind: 'ring', x: C.BASE_CELL.c + 0.5, y: C.BASE_CELL.r + 0.5,
          r0: 0.3, r1: 2.2, life: 0.5, max: 0.5, color: '#ff4d6d'
        });
        this.emit('leak', e);
        if (this.hp <= 0) {
          this.hp = 0;
          this.phase = 'defeat';
          this.emit('defeat', null);
        }
        continue;
      }
      this.updateEnemyPos(e);
      alive.push(e);
    }
    this.enemies = alive;
  };

  Game.prototype.findTarget = function (t, range) {
    var best = null, bestDist = -1;
    var r2 = range * range;
    var min = t.def.minRange || 0;
    var min2 = min * min;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.alive) continue;
      var d2 = dist2(t.x, t.y, e.x, e.y);
      if (d2 <= r2 && d2 >= min2 && e.dist > bestDist) {
        best = e; bestDist = e.dist;
      }
    }
    return best;
  };

  Game.prototype.updateTowers = function (dt) {
    for (var i = 0; i < this.towers.length; i++) {
      var t = this.towers[i];
      var st = this.towerStats(t);
      if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 4);
      t.cooldown -= dt;

      if (t.def.shot === 'pulse') {
        var any = this.findTarget(t, st.range);
        if (any && t.cooldown <= 0) {
          t.cooldown = 1 / st.rate;
          t.recoil = 1;
          this.icePulse(t, st);
        }
        if (any) {
          t.angle = Math.atan2(any.y - t.y, any.x - t.x);
        }
        continue;
      }

      var target = this.findTarget(t, st.range);
      if (!target) continue;
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      if (t.cooldown > 0) continue;
      t.cooldown = 1 / st.rate;
      t.recoil = 1;
      this.fire(t, st, target);
    }
  };

  Game.prototype.icePulse = function (t, st) {
    var r2 = st.range * st.range;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.alive) continue;
      if (dist2(t.x, t.y, e.x, e.y) <= r2) {
        this.applySlow(e, st.slow, st.slowDur);
        this.damageEnemy(e, st.dmg, false, t);
      }
    }
    this.addEffect({
      kind: 'ring', x: t.x, y: t.y, r0: 0.2, r1: st.range,
      life: 0.4, max: 0.4, color: '#7fdcff'
    });
  };

  Game.prototype.fire = function (t, st, target) {
    if (t.def.shot === 'beam') {
      this.damageEnemy(target, st.dmg, !!(t.def.pierce || st.pierce), t);
      this.addEffect({
        kind: 'beam', x1: t.x, y1: t.y, x2: target.x, y2: target.y,
        life: 0.18, max: 0.18, color: '#e0c3ff'
      });
      this.spawnParticles(target.x, target.y, 5, '#c792ff', 2);
      return;
    }
    var speed = t.def.shot === 'shell' ? 5.5 : 13;
    this.projectiles.push({
      id: this.nextId++,
      kind: t.def.shot,
      x: t.x, y: t.y,
      tx: target.x, ty: target.y,
      target: target,
      speed: speed,
      dmg: st.dmg,
      splash: st.splash || 0,
      burn: st.burn || null,
      pierce: !!(t.def.pierce || st.pierce),
      source: t,
      color: t.def.color,
      travelled: 0,
      totalDist: Math.hypot(target.x - t.x, target.y - t.y) || 0.01
    });
  };

  Game.prototype.updateProjectiles = function (dt) {
    var keep = [];
    for (var i = 0; i < this.projectiles.length; i++) {
      var p = this.projectiles[i];
      if (p.kind === 'arrow' && p.target && p.target.alive) {
        p.tx = p.target.x; p.ty = p.target.y;
      }
      var dx = p.tx - p.x, dy = p.ty - p.y;
      var d = Math.hypot(dx, dy);
      var step = p.speed * dt;
      p.angle = Math.atan2(dy, dx);
      if (d <= step || d < 0.02) {
        this.impact(p);
        continue;
      }
      p.x += (dx / d) * step;
      p.y += (dy / d) * step;
      p.travelled += step;
      if (p.travelled > 20) continue;    /* 念のための保険 */
      keep.push(p);
    }
    this.projectiles = keep;
  };

  Game.prototype.impact = function (p) {
    if (p.splash > 0) {
      var r2 = p.splash * p.splash;
      for (var i = 0; i < this.enemies.length; i++) {
        var e = this.enemies[i];
        if (!e.alive) continue;
        var d2 = dist2(p.tx, p.ty, e.x, e.y);
        if (d2 <= r2) {
          var falloff = 1 - 0.4 * (Math.sqrt(d2) / p.splash);
          this.damageEnemy(e, p.dmg * falloff, p.pierce, p.source);
          if (p.burn && e.alive) {
            e.burn = Math.max(e.burn, p.burn.dur);
            e.burnDps = Math.max(e.burnDps, p.burn.dps);
          }
        }
      }
      this.addEffect({
        kind: 'ring', x: p.tx, y: p.ty, r0: 0.15, r1: p.splash,
        life: 0.32, max: 0.32, color: '#ffb454'
      });
      this.spawnParticles(p.tx, p.ty, 14, '#ffb454', 3.2);
      this.shake = Math.max(this.shake, 0.22);
    } else if (p.target && p.target.alive) {
      this.damageEnemy(p.target, p.dmg, p.pierce, p.source);
      this.spawnParticles(p.tx, p.ty, 4, p.color, 1.8);
    }
  };

  Game.prototype.updateVisuals = function (dt) {
    var keep = [];
    for (var i = 0; i < this.effects.length; i++) {
      var f = this.effects[i];
      f.life -= dt;
      if (f.kind === 'text') f.y -= dt * 0.9;
      if (f.life > 0) keep.push(f);
    }
    this.effects = keep;

    var pk = [];
    for (var j = 0; j < this.particles.length; j++) {
      var p = this.particles[j];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy = p.vy * 0.94 + dt * 1.6;
      if (p.life > 0) pk.push(p);
    }
    this.particles = pk;

    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 2.4);
  };

  Game.prototype.checkWaveEnd = function () {
    if (this.phase !== 'wave') return;
    if (this.spawnQueue.length || this.enemies.length) return;
    var total = 0;
    var self = this;
    this.pendingWaves.forEach(function (w) {
      total += C.BALANCE.waveClearGold(w);
    });
    var cleared = this.pendingWaves.slice();
    this.pendingWaves = [];
    this.gold += total;
    this.stats.goldEarned += total;
    if (total > 0) {
      this.floatText(C.BASE_CELL.c + 0.5, C.BASE_CELL.r - 0.5, '+' + total, '#ffd75e');
    }
    if (this.wave >= C.TOTAL_WAVES) {
      this.phase = 'victory';
      this.emit('victory', null);
    } else {
      this.phase = 'ready';
      this.emit('waveClear', { waves: cleared, gold: total });
    }
    void self;
  };

  global.LFD.Game = Game;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * Last Fortress Defense - Canvas への描画担当
 * 座標は「マス単位」で持っていて、描くときに cell(1マスのピクセル数)を掛けます。
 */
(function (global) {
  'use strict';

  var C = global.LFD.Config;

  /* 古い Safari 向け: roundRect が無い場合の代替 */
  if (global.CanvasRenderingContext2D &&
      !global.CanvasRenderingContext2D.prototype.roundRect) {
    global.CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      var rr = Math.min(r, w / 2, h / 2);
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  function Renderer(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cell = 40;
    this.dpr = 1;
    this.t = 0;
    this.buildType = null;    /* 建設モードで選んでいるタワー種別 */
    this.aimAbility = null;   /* 照準中のアクティブスキル */
    this.selected = null;     /* 選択中のタワー */
    this.hoverCell = null;
  }

  /* 画面サイズに合わせてキャンバスの大きさを決める */
  Renderer.prototype.resize = function (availW, availH) {
    var cell = Math.floor(Math.min(availW / C.GRID_COLS, availH / C.GRID_ROWS));
    cell = Math.max(18, cell);
    this.cell = cell;
    var w = cell * C.GRID_COLS;
    var h = cell * C.GRID_ROWS;
    this.dpr = Math.min(global.devicePixelRatio || 1, 2.5);
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    return { w: w, h: h };
  };

  /* 画面のタッチ位置 -> マス座標 */
  Renderer.prototype.cellAt = function (clientX, clientY) {
    var rect = this.canvas.getBoundingClientRect();
    var x = (clientX - rect.left) / rect.width * C.GRID_COLS;
    var y = (clientY - rect.top) / rect.height * C.GRID_ROWS;
    return { c: Math.floor(x), r: Math.floor(y), x: x, y: y };
  };

  Renderer.prototype.draw = function (game, dt) {
    var ctx = this.ctx;
    var cell = this.cell;
    this.t += dt;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    var W = C.GRID_COLS * cell, H = C.GRID_ROWS * cell;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (game.shake > 0.01) {
      var s = game.shake * cell * 0.16;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    this.drawGround(ctx, W, H, cell);
    this.drawPath(ctx, cell);
    this.drawRocks(ctx, cell);
    this.drawBase(ctx, cell, game);
    this.drawBuildHints(ctx, cell, game);
    this.drawAbilityAim(ctx, cell);
    this.drawRangePreview(ctx, cell, game);
    this.drawTowers(ctx, cell, game);
    this.drawEnemies(ctx, cell, game);
    this.drawProjectiles(ctx, cell, game);
    this.drawEffects(ctx, cell, game);
    this.drawParticles(ctx, cell, game);

    ctx.restore();
  };

  /* ---- 地面と道 ------------------------------------------------------ */

  Renderer.prototype.drawGround = function (ctx, W, H, cell) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1e3a2b');
    g.addColorStop(1, '#16281f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (var c = 1; c < C.GRID_COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * cell, 0); ctx.lineTo(c * cell, H); ctx.stroke();
    }
    for (var r = 1; r < C.GRID_ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * cell); ctx.lineTo(W, r * cell); ctx.stroke();
    }
  };

  Renderer.prototype.drawPath = function (ctx, cell) {
    ctx.fillStyle = '#6b563c';
    C.PATH_CELLS.forEach(function (p) {
      ctx.fillRect(p.c * cell, p.r * cell, cell, cell);
    });
    /* 道の内側に明るい帯を描いて「通り道」らしく見せる */
    ctx.fillStyle = '#8a7250';
    C.PATH_CELLS.forEach(function (p) {
      ctx.fillRect(p.c * cell + cell * 0.1, p.r * cell + cell * 0.1, cell * 0.8, cell * 0.8);
    });

    /* 進行方向の矢印 */
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    var step = 2.0;
    for (var d = 1; d < C.PATH_LENGTH - 0.5; d += step) {
      var p1 = C.posAt(d), p2 = C.posAt(d + 0.4);
      var ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      ctx.save();
      ctx.translate(p1.x * cell, p1.y * cell);
      ctx.rotate(ang);
      var a = cell * 0.16;
      ctx.beginPath();
      ctx.moveTo(a, 0); ctx.lineTo(-a * 0.7, a * 0.65); ctx.lineTo(-a * 0.7, -a * 0.65);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* スタート地点(画面内に収まる位置に描く) */
    var first = C.PATH_CELLS[0];
    ctx.fillStyle = 'rgba(255,120,120,0.95)';
    ctx.font = 'bold ' + Math.round(cell * 0.26) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('START', (first.c + 0.7) * cell, (first.r - 0.28) * cell);
  };

  Renderer.prototype.drawRocks = function (ctx, cell) {
    C.ROCKS.forEach(function (rk) {
      var x = (rk.c + 0.5) * cell, y = (rk.r + 0.5) * cell;
      ctx.fillStyle = '#4a5560';
      ctx.beginPath();
      ctx.moveTo(x - cell * 0.3, y + cell * 0.24);
      ctx.lineTo(x - cell * 0.16, y - cell * 0.24);
      ctx.lineTo(x + cell * 0.18, y - cell * 0.28);
      ctx.lineTo(x + cell * 0.32, y + cell * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.moveTo(x - cell * 0.16, y - cell * 0.24);
      ctx.lineTo(x + cell * 0.18, y - cell * 0.28);
      ctx.lineTo(x + cell * 0.05, y - cell * 0.02);
      ctx.closePath();
      ctx.fill();
    });
  };

  Renderer.prototype.drawBase = function (ctx, cell, game) {
    var bx = (C.BASE_CELL.c + 0.5) * cell;
    var by = (C.BASE_CELL.r + 0.5) * cell;
    var ratio = Math.max(0, game.hp / game.maxHp);
    var pulse = 1 + Math.sin(this.t * 3) * 0.03;

    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(pulse, pulse);
    /* 城の土台 */
    ctx.fillStyle = ratio > 0.35 ? '#3f6fd8' : '#d84f4f';
    ctx.beginPath();
    ctx.roundRect(-cell * 0.38, -cell * 0.32, cell * 0.76, cell * 0.66, cell * 0.1);
    ctx.fill();
    /* 屋根 */
    ctx.fillStyle = ratio > 0.35 ? '#9fc0ff' : '#ffb3b3';
    ctx.beginPath();
    ctx.moveTo(-cell * 0.42, -cell * 0.3);
    ctx.lineTo(0, -cell * 0.52);
    ctx.lineTo(cell * 0.42, -cell * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold ' + Math.round(cell * 0.22) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('BASE', bx, by + cell * 0.24);
  };

  /* ---- 建設まわりの表示 ---------------------------------------------- */

  Renderer.prototype.drawBuildHints = function (ctx, cell, game) {
    if (!this.buildType) return;
    var def = C.TOWERS[this.buildType];
    var affordable = game.gold >= def.cost;
    for (var r = 0; r < C.GRID_ROWS; r++) {
      for (var c = 0; c < C.GRID_COLS; c++) {
        if (!game.canBuild(c, r)) continue;
        ctx.fillStyle = affordable ? 'rgba(120,255,160,0.16)' : 'rgba(255,255,255,0.07)';
        ctx.fillRect(c * cell + 2, r * cell + 2, cell - 4, cell - 4);
        ctx.strokeStyle = affordable ? 'rgba(150,255,180,0.5)' : 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(c * cell + 2, r * cell + 2, cell - 4, cell - 4);
      }
    }
    /* 指を置いているマスのプレビュー */
    var h = this.hoverCell;
    if (h && C.inGrid(h.c, h.r)) {
      var ok = game.canBuild(h.c, h.r) && affordable;
      var cx = (h.c + 0.5) * cell, cy = (h.r + 0.5) * cell;
      var lv = def.levels[0];
      ctx.fillStyle = ok ? 'rgba(120,255,160,0.12)' : 'rgba(255,80,80,0.16)';
      ctx.beginPath();
      ctx.arc(cx, cy, lv.range * cell, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(150,255,180,0.75)' : 'rgba(255,110,110,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
      if (def.minRange) {
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(cx, cy, def.minRange * cell, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (ok) {
        ctx.globalAlpha = 0.75;
        this.drawTowerShape(ctx, cell, def, 0, cx, cy, -Math.PI / 2, 0);
        ctx.globalAlpha = 1;
      } else {
        ctx.strokeStyle = 'rgba(255,110,110,0.95)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - cell * 0.22, cy - cell * 0.22);
        ctx.lineTo(cx + cell * 0.22, cy + cell * 0.22);
        ctx.moveTo(cx + cell * 0.22, cy - cell * 0.22);
        ctx.lineTo(cx - cell * 0.22, cy + cell * 0.22);
        ctx.stroke();
      }
    }
  };

  /* メテオの落下地点プレビュー */
  Renderer.prototype.drawAbilityAim = function (ctx, cell) {
    var def = this.aimAbility;
    var h = this.hoverCell;
    if (!def || !def.aimed || !h) return;
    var cx = h.x * cell, cy = h.y * cell;
    var pulse = 1 + Math.sin(this.t * 9) * 0.05;
    ctx.save();
    ctx.fillStyle = 'rgba(255,140,60,0.18)';
    ctx.beginPath();
    ctx.arc(cx, cy, def.radius * cell * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ff9a3c';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy, def.radius * cell * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(cx - cell * 0.3, cy); ctx.lineTo(cx + cell * 0.3, cy);
    ctx.moveTo(cx, cy - cell * 0.3); ctx.lineTo(cx, cy + cell * 0.3);
    ctx.stroke();
    ctx.restore();
  };

  Renderer.prototype.drawRangePreview = function (ctx, cell, game) {
    var t = this.selected;
    if (!t || game.towers.indexOf(t) < 0) return;
    var st = game.towerStats(t);
    var cx = t.x * cell, cy = t.y * cell;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.arc(cx, cy, st.range * cell, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = t.def.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (t.def.minRange) {
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(255,120,120,0.9)';
      ctx.beginPath();
      ctx.arc(cx, cy, t.def.minRange * cell, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(t.c * cell + 2, t.r * cell + 2, cell - 4, cell - 4);
  };

  /* ---- タワー -------------------------------------------------------- */

  Renderer.prototype.drawTowers = function (ctx, cell, game) {
    for (var i = 0; i < game.towers.length; i++) {
      var t = game.towers[i];
      this.drawTowerShape(ctx, cell, t.def, t.level, t.x * cell, t.y * cell, t.angle, t.recoil, t.branch);
    }
  };

  Renderer.prototype.drawTowerShape = function (ctx, cell, def, level, cx, cy, angle, recoil, branch) {
    var scale = 1 + level * 0.06;
    /* 土台 */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.roundRect(cx - cell * 0.36, cy - cell * 0.33, cell * 0.72, cell * 0.72, cell * 0.12);
    ctx.fill();
    ctx.fillStyle = '#2b3444';
    ctx.beginPath();
    ctx.roundRect(cx - cell * 0.36, cy - cell * 0.36, cell * 0.72, cell * 0.72, cell * 0.12);
    ctx.fill();
    ctx.strokeStyle = def.dark;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    var back = recoil * cell * 0.09;
    var R = cell * 0.3 * scale;

    if (def.id === 'archer') {
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#eaffea'; ctx.lineWidth = Math.max(2, cell * 0.05);
      ctx.beginPath();
      ctx.arc(-back + R * 0.15, 0, R * 0.75, -Math.PI * 0.55, Math.PI * 0.55);
      ctx.stroke();
      ctx.strokeStyle = def.dark; ctx.lineWidth = Math.max(1.5, cell * 0.04);
      ctx.beginPath();
      ctx.moveTo(-back - R * 0.2, 0); ctx.lineTo(-back + R * 1.0, 0);
      ctx.stroke();
    } else if (def.id === 'cannon') {
      ctx.fillStyle = def.dark;
      ctx.fillRect(-back, -R * 0.34, R * 1.35, R * 0.68);
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.arc(R * 1.25 - back, 0, R * 0.22, 0, Math.PI * 2); ctx.fill();
    } else if (def.id === 'ice') {
      /* 雪の結晶のような形(6方向のトゲ + 中心) */
      ctx.rotate(this.t * 0.6);
      ctx.strokeStyle = def.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(2, cell * 0.07);
      for (var k = 0; k < 6; k++) {
        var a = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95);
        ctx.stroke();
      }
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eaffff';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.lineCap = 'butt';
    } else {
      /* sniper */
      ctx.fillStyle = def.dark;
      ctx.fillRect(-back, -R * 0.16, R * 1.9, R * 0.32);
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.72, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(R * 0.35, 0, R * 0.16, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    /* Lv4(進化済み)は光る枠を付ける。進化先で色が違う */
    if (branch !== null && branch !== undefined) {
      ctx.strokeStyle = branch === 0 ? '#ffd75e' : '#7fdcff';
      ctx.lineWidth = Math.max(2, cell * 0.055);
      ctx.beginPath();
      ctx.roundRect(cx - cell * 0.4, cy - cell * 0.4, cell * 0.8, cell * 0.8, cell * 0.14);
      ctx.stroke();
    }

    /* レベルの印(★の代わりの小さな点) */
    for (var p = 0; p <= level; p++) {
      ctx.fillStyle = p === 3 ? '#ffd75e' : '#ffffff';
      ctx.beginPath();
      ctx.arc(cx - cell * 0.24 + p * cell * 0.16, cy + cell * 0.27, cell * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  /* ---- 敵 ------------------------------------------------------------ */

  /* 敵の輪郭だけを作る(塗りはしない)。ダメージ点滅を重ねるために分けている */
  Renderer.prototype.enemyPath = function (ctx, def, rad) {
    ctx.beginPath();
    var k, a, rr, px, py;
    if (def.id === 'fast') {
      ctx.moveTo(rad * 1.25, 0);
      ctx.lineTo(-rad * 0.85, rad * 0.85);
      ctx.lineTo(-rad * 0.4, 0);
      ctx.lineTo(-rad * 0.85, -rad * 0.85);
      ctx.closePath();
    } else if (def.id === 'tank') {
      ctx.roundRect(-rad, -rad * 0.85, rad * 2, rad * 1.7, rad * 0.3);
    } else if (def.id === 'swarm') {
      ctx.moveTo(rad, 0); ctx.lineTo(0, rad); ctx.lineTo(-rad, 0); ctx.lineTo(0, -rad);
      ctx.closePath();
    } else if (def.boss) {
      for (k = 0; k < 12; k++) {
        a = (k / 12) * Math.PI * 2;
        rr = k % 2 === 0 ? rad * 1.2 : rad * 0.74;
        px = Math.cos(a) * rr; py = Math.sin(a) * rr;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else {
      ctx.arc(0, 0, rad, 0, Math.PI * 2);
    }
  };

  Renderer.prototype.drawEnemies = function (ctx, cell, game) {
    /* ボスは一番手前に描く(小さい敵に隠れないように) */
    var list = game.enemies.slice().sort(function (a, b) {
      return (a.def.boss ? 1 : 0) - (b.def.boss ? 1 : 0);
    });
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var def = e.def;
      var x = e.x * cell, y = e.y * cell;
      var rad = def.radius * cell;
      var ang = Math.atan2(e.dirY || 0, e.dirX || 1);

      ctx.save();
      ctx.translate(x, y);

      if (def.boss) {
        var aura = 1 + Math.sin(this.t * 5) * 0.08;
        ctx.save();
        ctx.scale(aura, aura);
        ctx.fillStyle = 'rgba(255,61,110,0.20)';
        ctx.beginPath(); ctx.arc(0, 0, rad * 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      ctx.rotate(ang);
      ctx.lineWidth = Math.max(1.5, cell * (def.boss ? 0.06 : 0.035));

      /* 本体 */
      ctx.fillStyle = def.color;
      this.enemyPath(ctx, def, rad);
      ctx.fill();
      /* ダメージを受けた瞬間だけ白く光らせる(薄く重ねるだけ) */
      if (e.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.65, e.hitFlash / 0.13 * 0.65);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = def.boss ? '#ffd0dd' : def.dark;
      ctx.stroke();

      /* 種類ごとの飾り */
      if (def.id === 'tank') {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(-rad * 0.5, -rad * 0.85, rad * 0.35, rad * 1.7);
        ctx.fillRect(rad * 0.15, -rad * 0.85, rad * 0.35, rad * 1.7);
      } else if (def.boss) {
        ctx.fillStyle = '#2b0010';
        ctx.beginPath(); ctx.arc(rad * 0.3, -rad * 0.3, rad * 0.18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rad * 0.3, rad * 0.3, rad * 0.18, 0, Math.PI * 2); ctx.fill();
      } else if (def.id === 'normal') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.arc(rad * 0.35, -rad * 0.3, rad * 0.16, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rad * 0.35, rad * 0.3, rad * 0.16, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      /* Wave特性が付いている敵の印 */
      if (e.affix) {
        ctx.strokeStyle = e.affix.color;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = Math.max(1.5, cell * 0.045);
        ctx.beginPath();
        ctx.arc(x, y, rad * 1.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      /* 燃えている敵 */
      if (e.burn > 0) {
        ctx.fillStyle = 'rgba(255,150,50,0.55)';
        for (var fi = 0; fi < 3; fi++) {
          var fa = this.t * 6 + fi * 2.1;
          ctx.beginPath();
          ctx.arc(x + Math.cos(fa) * rad * 0.6, y - rad * 0.8 - (fi * 0.12 + (this.t * 1.5 % 0.3)) * cell,
            cell * 0.05, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* 凍結中の印 */
      if (e.slowTimer > 0) {
        ctx.strokeStyle = 'rgba(150,225,255,0.9)';
        ctx.lineWidth = Math.max(1.5, cell * 0.04);
        ctx.beginPath();
        ctx.arc(x, y, rad * 1.32, 0, Math.PI * 2);
        ctx.stroke();
      }

      /* HPバー */
      if (e.hp < e.maxHp || def.boss) {
        var bw = Math.max(rad * 2.2, cell * 0.4);
        var bh = Math.max(3, cell * (def.boss ? 0.1 : 0.06));
        var top = y - rad - bh - cell * 0.1;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(x - bw / 2, top, bw, bh);
        var ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = ratio > 0.5 ? '#6bec6b' : ratio > 0.22 ? '#ffd75e' : '#ff5c5c';
        ctx.fillRect(x - bw / 2 + 1, top + 1, (bw - 2) * ratio, bh - 2);
      }
    }
  };

  /* ---- 弾とエフェクト ------------------------------------------------ */

  Renderer.prototype.drawProjectiles = function (ctx, cell, game) {
    for (var i = 0; i < game.projectiles.length; i++) {
      var p = game.projectiles[i];
      var x = p.x * cell, y = p.y * cell;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p.angle || 0);
      if (p.kind === 'shell') {
        ctx.fillStyle = '#ffcf8b';
        ctx.beginPath(); ctx.arc(0, 0, cell * 0.11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,150,60,0.45)';
        ctx.beginPath(); ctx.arc(-cell * 0.12, 0, cell * 0.08, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#eaffea';
        ctx.fillRect(-cell * 0.14, -cell * 0.025, cell * 0.28, cell * 0.05);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(cell * 0.16, 0);
        ctx.lineTo(cell * 0.06, -cell * 0.05);
        ctx.lineTo(cell * 0.06, cell * 0.05);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  };

  Renderer.prototype.drawEffects = function (ctx, cell, game) {
    for (var i = 0; i < game.effects.length; i++) {
      var f = game.effects[i];
      var k = 1 - f.life / f.max;
      if (f.kind === 'ring') {
        var r = f.r0 + (f.r1 - f.r0) * k;
        ctx.strokeStyle = f.color;
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.lineWidth = Math.max(2, cell * 0.07 * (1 - k));
        ctx.beginPath();
        ctx.arc(f.x * cell, f.y * cell, r * cell, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (f.kind === 'beam') {
        ctx.strokeStyle = f.color;
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.lineWidth = Math.max(2, cell * 0.08 * (1 - k));
        ctx.beginPath();
        ctx.moveTo(f.x1 * cell, f.y1 * cell);
        ctx.lineTo(f.x2 * cell, f.y2 * cell);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (f.kind === 'flash') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, f.life / f.max) * 0.9;
        ctx.fillStyle = f.color;
        ctx.fillRect(0, 0, C.GRID_COLS * cell, C.GRID_ROWS * cell);
        ctx.restore();
      } else if (f.kind === 'text') {
        ctx.globalAlpha = Math.max(0, Math.min(1, f.life / f.max * 1.6));
        ctx.fillStyle = f.color;
        ctx.font = 'bold ' + Math.round(cell * 0.3) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x * cell, f.y * cell);
        ctx.fillText(f.text, f.x * cell, f.y * cell);
        ctx.globalAlpha = 1;
      }
    }
  };

  Renderer.prototype.drawParticles = function (ctx, cell, game) {
    for (var i = 0; i < game.particles.length; i++) {
      var p = game.particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      var s = p.size * cell;
      ctx.fillRect(p.x * cell - s / 2, p.y * cell - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  };

  global.LFD.Renderer = Renderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * ごく簡単な効果音(WebAudio で音を合成しているので音声ファイルは不要)
 * 音が出せない環境でもゲームが止まらないよう、すべて try/catch で守っています。
 */
(function (global) {
  'use strict';

  var ctx = null;
  var enabled = true;
  var lastAt = 0;

  function ensure() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) { enabled = false; return null; }
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (err) {
      enabled = false;
      return null;
    }
  }

  function tone(freq, dur, type, gain, slideTo) {
    var ac = ensure();
    if (!ac) return;
    try {
      var now = ac.currentTime;
      /* 音が重なりすぎて割れないように間引く */
      if (now - lastAt < 0.012) return;
      lastAt = now;
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    } catch (err) { /* 音が出なくてもゲームは続行 */ }
  }

  var Sfx = {
    unlock: function () { ensure(); },
    setEnabled: function (v) { enabled = v; if (v) ensure(); },
    isEnabled: function () { return enabled; },
    shoot: function () { tone(760, 0.05, 'square', 0.025); },
    cannon: function () { tone(160, 0.14, 'sawtooth', 0.05, 60); },
    ice: function () { tone(1200, 0.12, 'sine', 0.035, 1800); },
    snipe: function () { tone(300, 0.16, 'sawtooth', 0.05, 1400); },
    kill: function () { tone(420, 0.08, 'triangle', 0.045, 220); },
    build: function () { tone(520, 0.09, 'triangle', 0.07, 880); },
    upgrade: function () { tone(660, 0.16, 'triangle', 0.08, 1320); },
    sell: function () { tone(600, 0.12, 'triangle', 0.06, 300); },
    error: function () { tone(200, 0.12, 'square', 0.05, 140); },
    leak: function () { tone(180, 0.28, 'sawtooth', 0.08, 90); },
    boss: function () { tone(90, 0.7, 'sawtooth', 0.1, 55); },
    win: function () {
      [523, 659, 784, 1047].forEach(function (f, i) {
        setTimeout(function () { tone(f, 0.28, 'triangle', 0.08); }, i * 130);
      });
    },
    lose: function () {
      [400, 320, 240, 150].forEach(function (f, i) {
        setTimeout(function () { tone(f, 0.34, 'sawtooth', 0.08); }, i * 170);
      });
    }
  };

  global.LFD = global.LFD || {};
  global.LFD.Sfx = Sfx;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * Last Fortress Defense - 画面(DOM)とゲーム本体をつなぐ部分
 * ・タッチ操作の受付
 * ・HUD / タワーパネル / オーバーレイの更新
 * ・ゲームループ
 */
(function (global) {
  'use strict';

  var C = global.LFD.Config;
  var Sfx = global.LFD.Sfx;
  var doc = global.document;
  var $ = function (id) { return doc.getElementById(id); };

  var game = new global.LFD.Game({ seed: Date.now() % 100000 });
  var canvas = $('game');
  var renderer = new global.LFD.Renderer(canvas);

  var state = {
    paused: false,
    speed: 1,
    started: false,
    overlay: 'start',
    buildType: null,
    aimAbility: null,
    selected: null,
    pointerDown: false,
    lastPanelUpdate: 0
  };

  /* ---- トースト表示 --------------------------------------------------- */
  var toastEl = $('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1400);
  }

  var bannerEl = $('wave-banner');
  var bannerTimer = null;
  function banner(msg, isBoss) {
    bannerEl.textContent = msg;
    bannerEl.classList.toggle('boss', !!isBoss);
    bannerEl.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { bannerEl.classList.remove('show'); }, 1500);
  }

  var lastHud = {};

  /* ---- タワー選択パレット --------------------------------------------- */
  var paletteEl = $('palette');
  var cards = {};

  function buildPalette() {
    paletteEl.innerHTML = '';
    C.TOWER_ORDER.forEach(function (id) {
      var def = C.TOWERS[id];
      var card = doc.createElement('div');
      card.className = 'tw-card';
      card.dataset.type = id;
      card.setAttribute('role', 'button');
      card.innerHTML = '<canvas width="68" height="68"></canvas>' +
        '<span class="nm">' + def.name + '</span>' +
        '<span class="cs">' + def.cost + '</span>';
      paletteEl.appendChild(card);
      var mini = card.querySelector('canvas');
      drawMiniTower(mini, def, 0);
      card.addEventListener('click', function () { selectBuildType(id); });
      cards[id] = card;
    });
  }

  function drawMiniTower(cv, def, level) {
    var ctx = cv.getContext('2d');
    var size = cv.width;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.scale(size / 44, size / 44);
    renderer.drawTowerShape(ctx, 44, def, level, 22, 22, -Math.PI / 2, 0);
    ctx.restore();
  }

  function selectBuildType(id) {
    closePanel();
    if (state.buildType === id) { cancelBuild(); return; }
    state.buildType = id;
    renderer.buildType = id;
    renderer.hoverCell = null;
    Object.keys(cards).forEach(function (k) {
      cards[k].classList.toggle('selected', k === id);
    });
    $('btn-wave').hidden = true;
    $('btn-cancel-build').hidden = false;
    var pv = $('wave-preview');
    pv.classList.add('building');
    pv.textContent = C.TOWERS[id].name + ' を置く場所をタップ';
    lastHud.pv = null;
    Sfx.unlock();
  }

  function cancelBuild() {
    state.buildType = null;
    state.aimAbility = null;
    renderer.buildType = null;
    renderer.aimAbility = null;
    renderer.hoverCell = null;
    Object.keys(abilityEls).forEach(function (k) {
      abilityEls[k].classList.remove('aiming');
    });
    Object.keys(cards).forEach(function (k) { cards[k].classList.remove('selected'); });
    $('btn-wave').hidden = false;
    $('btn-cancel-build').hidden = true;
    $('wave-preview').classList.remove('building');
    lastHud.pv = null;
  }

  /* ---- アクティブスキル ------------------------------------------------ */
  var abilityEls = {};

  function buildAbilities() {
    var wrap = $('abilities');
    wrap.innerHTML = '';
    C.ABILITY_ORDER.forEach(function (key) {
      var def = C.ABILITIES[key];
      var btn = doc.createElement('button');
      btn.className = 'ab-btn';
      btn.dataset.ability = key;
      btn.innerHTML = '<i class="cd"></i><span class="ico">' + def.icon + '</span>' +
        '<span class="nm">' + def.name + '</span><span class="sec"></span>';
      btn.addEventListener('click', function () { onAbilityTap(key); });
      wrap.appendChild(btn);
      abilityEls[key] = btn;
    });
  }

  function onAbilityTap(key) {
    var def = C.ABILITIES[key];
    Sfx.unlock();
    if (!game.abilityReady(key)) {
      Sfx.error();
      toast(def.name + ' は充填中');
      return;
    }
    if (state.aimAbility === key) { cancelBuild(); return; }
    if (def.aimed) {
      closePanel();
      cancelBuild();
      state.aimAbility = key;
      renderer.aimAbility = def;
      $('btn-wave').hidden = true;
      $('btn-cancel-build').hidden = false;
      var pv = $('wave-preview');
      pv.classList.add('building');
      pv.textContent = def.name + ' を落とす場所をタップ';
      lastHud.pv = null;
      abilityEls[key].classList.add('aiming');
      return;
    }
    var res = game.useAbility(key);
    if (res.ok) { Sfx.ice(); toast(def.name + '! ' + res.frozen + '体を凍結'); }
  }

  function updateAbilityButtons() {
    C.ABILITY_ORDER.forEach(function (key) {
      var btn = abilityEls[key];
      if (!btn) return;
      var def = C.ABILITIES[key];
      var cd = game.abilities[key].cd;
      var ready = cd <= 0;
      if (btn.dataset.ready !== String(ready)) {
        btn.classList.toggle('ready', ready);
        btn.dataset.ready = String(ready);
      }
      var pct = ready ? 0 : (cd / def.cooldown) * 100;
      btn.querySelector('.cd').style.width = pct.toFixed(1) + '%';
      var label = ready ? '' : Math.ceil(cd) + 's';
      var sec = btn.querySelector('.sec');
      if (sec.textContent !== label) sec.textContent = label;
    });
  }

  /* ---- タワー詳細パネル ----------------------------------------------- */
  var panelEl = $('tower-panel');

  function openPanel(t) {
    state.selected = t;
    renderer.selected = t;
    panelEl.hidden = false;
    paletteEl.style.visibility = 'hidden';
    cancelBuild();
    updatePanel(true);
  }

  function closePanel() {
    state.selected = null;
    renderer.selected = null;
    panelEl.hidden = true;
    paletteEl.style.visibility = '';
  }

  function fmt(n) {
    return Math.round(n * 100) / 100;
  }

  function updatePanel(force) {
    var t = state.selected;
    if (!t) return;
    if (game.towers.indexOf(t) < 0) { closePanel(); return; }
    var now = performance.now();
    if (!force && now - state.lastPanelUpdate < 180) return;
    state.lastPanelUpdate = now;

    var def = t.def;
    var st = game.towerStats(t);
    var opt0 = game.upgradeOptions(t)[0];
    var next = (opt0 && game.upgradeOptions(t).length === 1) ? opt0.stats : null;

    drawMiniTower(panelEl.querySelector('.tp-icon'), def, t.level);
    $('tp-name').textContent = def.name;
    $('tp-level').textContent = 'Lv' + (t.level + 1) +
      (t.branch !== null && t.branch !== undefined ? ' ' + def.branches[t.branch].label : '') +
      (game.isMaxLevel(t) ? ' (MAX)' : '');

    var rows = [
      ['攻撃力', st.dmg, next && next.dmg],
      ['攻撃速度', fmt(st.rate) + '/秒', next && (fmt(next.rate) + '/秒')],
      ['射程', fmt(st.range), next && fmt(next.range)],
      ['秒間火力', Math.round(st.dmg * st.rate), next && Math.round(next.dmg * next.rate)]
    ];
    if (st.splash) rows.push(['範囲', fmt(st.splash), next && fmt(next.splash)]);
    if (st.slow) {
      rows.push(['減速', Math.round(st.slow * 100) + '%', next && (Math.round(next.slow * 100) + '%')]);
      rows.push(['減速時間', fmt(st.slowDur) + '秒', next && (fmt(next.slowDur) + '秒')]);
    }
    if (def.pierce) rows.push(['装甲', '無視', null]);
    if (def.minRange) rows.push(['最低射程', fmt(def.minRange), null]);

    $('tp-stats').innerHTML = rows.map(function (r) {
      var nextTxt = (r[2] !== null && r[2] !== undefined && String(r[2]) !== String(r[1]))
        ? ' <span class="up">→ ' + r[2] + '</span>' : '';
      return '<div class="row"><span class="k">' + r[0] + '</span>' +
        '<span class="v">' + r[1] + nextTxt + '</span></div>';
    }).join('');

    var upBtn = $('btn-upgrade');
    var brWrap = $('tp-branches');
    var opts = game.upgradeOptions(t);
    var isBranch = opts.length > 1;

    if (isBranch) {
      /* Lv4は2つの進化先から選ぶ */
      brWrap.hidden = false;
      upBtn.hidden = true;
      var sig = opts.map(function (o) { return o.index + ':' + (game.gold >= o.cost); }).join('|');
      if (brWrap.dataset.sig !== sig) {
        brWrap.dataset.sig = sig;
        brWrap.innerHTML = '';
        opts.forEach(function (o) {
          var btn = doc.createElement('button');
          btn.className = 'br-btn';
          btn.disabled = game.gold < o.cost;
          btn.innerHTML = '<span><span class="bl">⚡' + o.label + '</span><br>' +
            '<span class="bn">' + o.note + '</span></span>' +
            '<span class="bc">' + o.cost + '</span>';
          btn.addEventListener('click', function () { doUpgrade(o.index); });
          brWrap.appendChild(btn);
        });
      }
    } else {
      brWrap.hidden = true;
      brWrap.dataset.sig = '';
      upBtn.hidden = false;
      var cost = opts.length ? opts[0].cost : null;
      if (cost === null) {
        upBtn.disabled = true;
        $('up-cost').textContent = 'MAX';
      } else {
        upBtn.disabled = game.gold < cost;
        $('up-cost').textContent = cost;
      }
    }
    $('sell-val').textContent = '+' + game.sellValue(t);
  }

  function doUpgrade(branchIndex) {
    var t = state.selected;
    if (!t) return;
    var res = game.upgrade(t, branchIndex);
    if (res.ok) {
      Sfx.upgrade();
      var label = (t.branch !== null && t.branch !== undefined)
        ? t.def.name + ' → ' + t.def.branches[t.branch].label
        : t.def.name + ' Lv' + (t.level + 1);
      toast(label + ' に強化');
      updatePanel(true);
    } else {
      Sfx.error();
      toast(res.reason === 'gold' ? 'ゴールドが足りません' : 'これ以上強化できません');
    }
  }

  /* ---- HUD ------------------------------------------------------------ */
  function updateHud() {
    var hp = Math.max(0, game.hp);
    if (lastHud.hp !== hp) {
      $('hp-val').textContent = hp;
      $('hp-bar').style.width = (hp / game.maxHp * 100) + '%';
      lastHud.hp = hp;
    }
    var gold = Math.floor(game.gold);
    if (lastHud.gold !== gold) {
      $('gold-val').textContent = gold;
      lastHud.gold = gold;
      Object.keys(cards).forEach(function (k) {
        cards[k].classList.toggle('poor', gold < C.TOWERS[k].cost);
      });
    }
    if (lastHud.wave !== game.wave) {
      $('wave-val').textContent = game.wave;
      lastHud.wave = game.wave;
    }

    var btn = $('btn-wave');
    var label, disabled = false;
    if (game.phase === 'ready') {
      if (game.wave >= C.TOTAL_WAVES) {
        label = '全Wave終了'; disabled = true;
      } else {
        label = 'WAVE ' + (game.wave + 1) + ' を開始';
      }
    } else if (game.phase === 'wave') {
      if (game.wave >= C.TOTAL_WAVES) {
        label = '最終WAVE 進行中'; disabled = true;
      } else {
        label = '次を呼ぶ +' + C.BALANCE.earlyCallGold(game.wave);
      }
    } else {
      label = '終了'; disabled = true;
    }
    if (lastHud.btn !== label || lastHud.btnDis !== disabled) {
      btn.textContent = label;
      btn.disabled = disabled;
      lastHud.btn = label; lastHud.btnDis = disabled;
    }

    var previewWave = game.phase === 'wave' ? game.wave + 1 : game.wave + 1;
    var pv;
    if (previewWave > C.TOTAL_WAVES) {
      pv = '次のWave: なし(最終Wave)';
    } else {
      var def = C.WAVES[previewWave - 1];
      var parts = {};
      def.groups.forEach(function (g) { parts[g[0]] = (parts[g[0]] || 0) + g[1]; });
      pv = 'Wave ' + previewWave + ': ' + Object.keys(parts).map(function (k) {
        return C.ENEMIES[k].name + '×' + parts[k];
      }).join(' / ');
      if (def.affix) {
        var af = C.AFFIXES[def.affix];
        pv += '  ' + af.icon + af.name;
      }
    }
    if (!state.buildType && !state.aimAbility && lastHud.pv !== pv) {
      $('wave-preview').textContent = pv;
      lastHud.pv = pv;
    }
  }

  /* ---- ボスHPバー ------------------------------------------------------ */
  var bossBar = $('boss-hp');
  function updateBossBar() {
    var boss = null;
    for (var i = 0; i < game.enemies.length; i++) {
      if (game.enemies[i].def.boss) { boss = game.enemies[i]; break; }
    }
    if (!boss) {
      if (!bossBar.hidden) bossBar.hidden = true;
      return;
    }
    bossBar.hidden = false;
    var pct = Math.max(0, boss.hp / boss.maxHp) * 100;
    bossBar.querySelector('i').style.width = pct.toFixed(1) + '%';
    bossBar.querySelector('span').textContent = 'BOSS  ' + Math.ceil(Math.max(0, boss.hp));
  }

  /* ---- 進行中Waveの特性バッジ ------------------------------------------ */
  var affixEl = $('affix-badge');
  function updateAffixBadge() {
    var key = null;
    if (game.phase === 'wave') {
      for (var i = 0; i < game.pendingWaves.length; i++) {
        var w = C.WAVES[game.pendingWaves[i] - 1];
        if (w && w.affix) { key = w.affix; break; }
      }
    }
    if (!key) {
      if (!affixEl.hidden) affixEl.hidden = true;
      lastHud.affix = null;
      return;
    }
    if (lastHud.affix !== key) {
      var af = C.AFFIXES[key];
      affixEl.hidden = false;
      affixEl.style.color = af.color;
      affixEl.textContent = af.icon + ' ' + af.name + ' ' + af.short;
      lastHud.affix = key;
    }
  }

  /* ---- オーバーレイ ---------------------------------------------------- */
  function showOverlay(kind) {
    state.overlay = kind;
    var ov = $('overlay');
    var title = $('ov-title'), sub = $('ov-sub'), body = $('ov-body');
    var btn = $('ov-btn'), btn2 = $('ov-btn2');
    btn2.hidden = true;
    ov.hidden = false;

    if (kind === 'start') {
      title.textContent = 'LAST FORTRESS DEFENSE';
      sub.textContent = '全15Wave。最後のボスから拠点を守れ';
      body.innerHTML = '<div class="rules">' +
        '① 下の4つから<b>タワーを選ぶ</b><br>' +
        '② 地図の<b>光ったマス</b>をタップして設置<br>' +
        '③ <b>WAVE開始</b>を押すと敵が出現<br>' +
        '④ 敵を倒すと<b>ゴールド</b>が増える<br>' +
        '⑤ 置いたタワーをタップで<b>強化 / 売却</b><br>' +
        '⑥ <b>☄メテオ・❄氷結</b>は時間で回復。ピンチに使おう<br><br>' +
        '<b>コツ:</b> アイスで足を止めてキャノンで巻き込み、ボスにはスナイパー。' +
        '同じタワーばかりでは後半は勝てません。<br>' +
        'Lv4では<b>2つの進化先から選択</b>できます。' +
        '</div>';
      btn.textContent = 'スタート';
    } else if (kind === 'pause') {
      title.textContent = 'PAUSE';
      sub.textContent = '一時停止中';
      body.innerHTML = scoreHtml();
      btn.textContent = '再開する';
      btn2.hidden = false;
      btn2.textContent = '最初からやり直す';
    } else if (kind === 'victory') {
      title.textContent = '🏆 VICTORY';
      sub.textContent = '全15Waveを防衛しきりました！';
      body.innerHTML = scoreHtml();
      btn.textContent = 'もう一度あそぶ';
    } else if (kind === 'defeat') {
      title.textContent = '💀 GAME OVER';
      sub.textContent = 'Wave ' + game.wave + ' で拠点が陥落…';
      body.innerHTML = scoreHtml();
      btn.textContent = 'もう一度あそぶ';
    }
  }

  function scoreHtml() {
    return '<div class="score">' +
      '<div><div class="k">到達Wave</div><div class="v">' + game.wave + '/15</div></div>' +
      '<div><div class="k">残りHP</div><div class="v">' + Math.max(0, game.hp) + '</div></div>' +
      '<div><div class="k">撃破数</div><div class="v">' + game.stats.killed + '</div></div>' +
      '<div><div class="k">獲得Gold</div><div class="v">' + game.stats.goldEarned + '</div></div>' +
      '</div>';
  }

  function hideOverlay() {
    $('overlay').hidden = true;
    state.overlay = null;
  }

  function restart() {
    game.reset();
    lastHud = {};
    cancelBuild();
    closePanel();
    affixEl.hidden = true;
    state.paused = false;
    state.speed = 1;
    $('btn-speed').textContent = '×1';
    $('btn-speed').classList.remove('on');
    $('btn-pause').classList.remove('on');
    hideOverlay();
    updateHud();
  }

  /* ---- 入力 ------------------------------------------------------------ */
  function onPointerDown(ev) {
    Sfx.unlock();
    state.pointerDown = true;
    if (state.buildType || state.aimAbility) {
      renderer.hoverCell = renderer.cellAt(ev.clientX, ev.clientY);
    }
    ev.preventDefault();
  }

  function onPointerMove(ev) {
    if (!state.pointerDown || (!state.buildType && !state.aimAbility)) return;
    renderer.hoverCell = renderer.cellAt(ev.clientX, ev.clientY);
    ev.preventDefault();
  }

  function onPointerUp(ev) {
    if (!state.pointerDown) return;
    state.pointerDown = false;
    var cellPos = renderer.cellAt(ev.clientX, ev.clientY);
    renderer.hoverCell = null;

    if (game.phase === 'victory' || game.phase === 'defeat') return;

    if (state.aimAbility) {
      var key = state.aimAbility;
      var res = game.useAbility(key, cellPos.x, cellPos.y);
      if (res.ok) {
        Sfx.cannon();
        toast(C.ABILITIES[key].name + '! ' + res.hits + '体に命中');
      } else {
        Sfx.error();
        toast('まだ使えません');
      }
      cancelBuild();
      return;
    }

    if (state.buildType) {
      var res = game.build(cellPos.c, cellPos.r, state.buildType);
      if (res.ok) {
        Sfx.build();
        toast(res.tower.def.name + ' を設置');
        /* 置いたら選択を解除する(続けてタップしても誤設置しないように) */
        cancelBuild();
      } else {
        Sfx.error();
        toast(res.reason === 'gold' ? 'ゴールドが足りません' : 'ここには置けません');
      }
      return;
    }

    var t = game.towerAt(cellPos.c, cellPos.r);
    if (t) {
      openPanel(t);
    } else if (state.selected) {
      closePanel();
    }
  }

  /* ---- ゲームループ ---------------------------------------------------- */
  var STEP = 1 / 60;
  var acc = 0;
  var lastTs = 0;

  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 0;
    lastTs = ts;

    if (state.started && !state.paused) {
      acc += dt * state.speed;
      var guard = 0;
      while (acc >= STEP && guard++ < 12) {
        game.update(STEP);
        acc -= STEP;
      }
      handleEvents();
    }

    renderer.draw(game, dt);
    updateHud();
    updateBossBar();
    updateAffixBadge();
    updateAbilityButtons();
    if (state.selected) updatePanel(false);
    global.requestAnimationFrame(frame);
  }

  function handleEvents() {
    var evs = game.drainEvents();
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      switch (e.type) {
        case 'kill': Sfx.kill(); break;
        case 'leak': Sfx.leak(); break;
        case 'bossSpawn': Sfx.boss(); banner('BOSS 出現!', true); break;
        case 'waveClear':
          toast('Wave クリア! +' + e.data.gold + 'G');
          break;
        case 'victory':
          Sfx.win(); showOverlay('victory'); break;
        case 'defeat':
          Sfx.lose(); showOverlay('defeat'); break;
      }
    }
  }

  /* 攻撃音は毎フレーム鳴らすとうるさいので、発射数を見て間引く */
  var lastProjCount = 0;
  setInterval(function () {
    if (!state.started || state.paused) return;
    var n = game.projectiles.length;
    if (n > lastProjCount) Sfx.shoot();
    lastProjCount = n;
  }, 140);

  /* ---- サイズ調整 ------------------------------------------------------ */
  function fit() {
    var stage = $('stage');
    var w = stage.clientWidth - 8;
    var h = stage.clientHeight - 8;
    if (w <= 0 || h <= 0) return;
    renderer.resize(w, h);
  }

  /* ---- 起動 ------------------------------------------------------------ */
  function init() {
    buildPalette();
    buildAbilities();
    fit();
    updateHud();
    showOverlay('start');

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', function () {
      state.pointerDown = false; renderer.hoverCell = null;
    });

    $('btn-cancel-build').addEventListener('click', cancelBuild);
    $('btn-close-panel').addEventListener('click', closePanel);

    $('btn-upgrade').addEventListener('click', function () { doUpgrade(null); });

    $('btn-sell').addEventListener('click', function () {
      var t = state.selected;
      if (!t) return;
      var res = game.sell(t);
      if (res.ok) { Sfx.sell(); toast('+' + res.value + 'G で売却'); closePanel(); }
    });

    $('btn-wave').addEventListener('click', function () {
      if (!state.started) return;
      var res = game.startWave();
      if (res.ok) {
        var isBoss = game.wave === C.TOTAL_WAVES;
        var wdef = C.WAVES[game.wave - 1];
        var btxt = isBoss ? 'FINAL WAVE' : 'WAVE ' + game.wave;
        if (wdef.affix) btxt += '  ' + C.AFFIXES[wdef.affix].icon + C.AFFIXES[wdef.affix].name;
        banner(btxt, isBoss);
        if (!isBoss) Sfx.build();
        updateHud();
      }
    });

    $('btn-speed').addEventListener('click', function () {
      state.speed = state.speed === 1 ? 2 : 1;
      this.textContent = '×' + state.speed;
      this.classList.toggle('on', state.speed === 2);
    });

    $('btn-pause').addEventListener('click', function () {
      if (!state.started) return;
      if (state.paused) { state.paused = false; hideOverlay(); this.classList.remove('on'); }
      else { state.paused = true; showOverlay('pause'); this.classList.add('on'); }
    });

    $('btn-sound').addEventListener('click', function () {
      var on = !Sfx.isEnabled();
      Sfx.setEnabled(on);
      this.classList.toggle('muted', !on);
      this.setAttribute('aria-label', on ? '音を消す' : '音を出す');
    });

    $('ov-btn').addEventListener('click', function () {
      Sfx.unlock();
      if (state.overlay === 'start') {
        state.started = true;
        hideOverlay();
      } else if (state.overlay === 'pause') {
        state.paused = false;
        $('btn-pause').classList.remove('on');
        hideOverlay();
      } else {
        restart();
        state.started = true;
      }
    });

    $('ov-btn2').addEventListener('click', function () {
      restart();
      state.started = true;
    });

    global.addEventListener('resize', fit);
    global.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
    if (global.ResizeObserver) {
      new global.ResizeObserver(fit).observe($('stage'));
    }

    /* パソコンで確認するとき用のショートカット */
    doc.addEventListener('keydown', function (ev) {
      if (ev.key === ' ') { ev.preventDefault(); $('btn-wave').click(); }
      else if (ev.key === 'p') $('btn-pause').click();
      else if (ev.key >= '1' && ev.key <= '4') {
        selectBuildType(C.TOWER_ORDER[Number(ev.key) - 1]);
      } else if (ev.key === 'Escape') { cancelBuild(); closePanel(); }
    });

    global.requestAnimationFrame(frame);
  }

  /* テストから触れるように公開しておく */
  global.LFD.app = {
    game: game,
    renderer: renderer,
    state: state,
    toast: toast,
    restart: restart,
    selectBuildType: selectBuildType,
    openPanel: openPanel,
    fit: fit
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
  else init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>

</body>
</html>
